{% extends "base.html" %} {% block content %}

<section class="quiz-wrapper">
  <div class="quiz-card">
    <p class="badge">{{ question[9] }}</p>
    <h1>{{ question[1] }}</h1>

    <form action="/check" method="POST">
      <input type="hidden" name="question_id" value="{{ question[0] }}" />
      <input
        type="hidden"
        name="category_filter"
        value="{{ category or '' }}"
      />

      {% if question[2] == "multiple_choice" %}
      <label class="answer-option">
        <input type="radio" name="answer" value="A" required />
        <span>A</span>
        {{ question[3] }}
      </label>

      <label class="answer-option">
        <input type="radio" name="answer" value="B" />
        <span>B</span>
        {{ question[4] }}
      </label>

      <label class="answer-option">
        <input type="radio" name="answer" value="C" />
        <span>C</span>
        {{ question[5] }}
      </label>

      <label class="answer-option">
        <input type="radio" name="answer" value="D" />
        <span>D</span>
        {{ question[6] }}
      </label>
      {% else %}
      <textarea
        name="answer"
        placeholder="Schreibe deine Antwort hier..."
        required
      ></textarea>
      {% endif %}

      <button class="button primary full" type="submit">Antwort prüfen</button>
    </form>
  </div>
</section>

{% endblock %}
